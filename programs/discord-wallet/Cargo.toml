[package]
name = "discord-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "discord_wallet"

[features]
default = []
bpf-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", features = ["cpi"] }
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
solana-address = { version = "~2.6.1", features = ["curve25519", "decode"] }
solana-instruction = { version = "~3.4.0", features = ["syscalls"] }
solana-program-log = "1.2.0"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.16.0", features = ["precompiles"] }
litesvm-token = "0.16.0"
solana-clock = "~3.1.1"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-program-pack = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
solana-transaction = "4.1.5"
solana-transaction-error = "~3.3.1"
spl-associated-token-account-interface = "2.0.0"
